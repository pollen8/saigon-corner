# Production on the droplet (no Caddy — TLS on Haven’s Caddy).
# `app` joins Haven’s Docker network so Caddy can reach saigon-staff-app:3100.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: saigon_staff
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saigon_staff"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  app:
    container_name: saigon-staff-app
    build:
      context: .
      args:
        VITE_AUTH_URL: ${BETTER_AUTH_URL}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/saigon_staff
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3100"
    networks:
      - default
      - haven

networks:
  haven:
    external: true
    name: haven_default

volumes:
  postgres_data: