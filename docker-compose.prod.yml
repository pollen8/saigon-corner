# Production on the droplet (no Caddy — TLS on Haven’s Caddy).
#
# Postgres password is NOT interpolated from Compose `.env`.
# Put the same string in `secrets/postgres_password` (one line, no quotes).
# Copy that file to both postgres and app via POSTGRES_PASSWORD_FILE.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: saigon_staff
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets/postgres_password:/run/secrets/postgres_password:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saigon_staff"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  app:
    container_name: saigon-staff-app
    build:
      context: .
      args:
        VITE_AUTH_URL: ${BETTER_AUTH_URL}
    env_file:
      - .env.container
    environment:
      NODE_ENV: production
      PORT: 3100
      POSTGRES_USER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: saigon_staff
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ./secrets/postgres_password:/run/secrets/postgres_password:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3100"
    networks:
      - default
      - haven

networks:
  haven:
    external: true
    name: haven_default

volumes:
  postgres_data: