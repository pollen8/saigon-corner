# Production on the droplet (no Caddy — TLS on Haven’s Caddy).
#
# Compose interpolates ${VARS} from `.env` in this directory. Do not put
# POSTGRES_PASSWORD in `.env` if it contains $ or % — those are mangled.
# Use POSTGRES_PASSWORD in `.env.container` instead (loaded as-is into containers).

services:
  postgres:
    image: postgres:16
    env_file:
      - .env.container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: saigon_staff
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saigon_staff"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  app:
    container_name: saigon-staff-app
    build:
      context: .
      args:
        VITE_AUTH_URL: ${BETTER_AUTH_URL}
    env_file:
      - .env.container
    environment:
      NODE_ENV: production
      PORT: 3100
      POSTGRES_USER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: saigon_staff
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3100"
    networks:
      - default
      - haven

networks:
  haven:
    external: true
    name: haven_default

volumes:
  postgres_data: